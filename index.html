<script id="core">
/* Pure stock logic: every quantity and value is replayed from the movements, so nobody overwrites anybody. */
const Stock={
  MAG:"magazijn",
  replay(movements,until){
    const list=[...movements].filter(m=>!until||m.at<=until)
      .sort((a,b)=>a.at<b.at?-1:a.at>b.at?1:(a.id<b.id?-1:1));
    const undone=new Set(list.filter(m=>m.type==="storno").map(m=>m.herstelt));
    const s={},cost={},diff={};
    const get=id=>s[id]||(s[id]={qty:0,avg:0,last:0,pl:{},lastIn:"",lastOut:"",lastCount:"",melding:""});
    for(const m of list){
      if(m.type==="storno"||undone.has(m.id))continue;
      const p=get(m.productId),q=Number(m.qty)||0;
      if(m.type==="melding"){p.melding=m.at;continue}
      if(m.type==="in"){
        const price=m.price==null||m.price===""?p.avg:Number(m.price)||0;
        const base=Math.max(p.qty,0);
        p.avg=base+q>0?(base*p.avg+q*price)/(base+q):p.avg;
        p.qty+=q;p.last=price;p.lastIn=m.at;
        const pl=m.plaats||Stock.MAG;p.pl[pl]=(p.pl[pl]||0)+q;
      }else if(m.type==="uit"){
        const pl=m.van||Stock.MAG;p.pl[pl]=(p.pl[pl]||0)-q;p.qty-=q;cost[m.id]=q*p.avg;p.lastOut=m.at;
      }else if(m.type==="retour"){
        const pl=m.plaats||Stock.MAG;p.pl[pl]=(p.pl[pl]||0)+q;p.qty+=q;cost[m.id]=-q*p.avg;
      }else if(m.type==="verplaats"){
        p.pl[m.van]=(p.pl[m.van]||0)-q;p.pl[m.naar]=(p.pl[m.naar]||0)+q;
      }else if(m.type==="telling"){
        const pl=m.plaats||Stock.MAG,d=q-(p.pl[pl]||0);
        p.pl[pl]=q;p.qty+=d;p.lastCount=m.at;diff[m.id]=d*p.avg;
      }
    }
    return {stock:s,cost,diff,undone};
  },
  value(e){return e?Math.max(e.qty,0)*e.avg:0},
  /* net use per product in the last `days` days, undone bookings excluded */
  verbruik(movements,nowIso,days){
    const from=new Date(new Date(nowIso).getTime()-days*864e5).toISOString();
    const undone=new Set(movements.filter(m=>m.type==="storno").map(m=>m.herstelt)),o={};
    for(const m of movements){
      if(m.at<from||undone.has(m.id))continue;
      if(m.type==="uit")o[m.productId]=(o[m.productId]||0)+Number(m.qty);
      if(m.type==="retour")o[m.productId]=(o[m.productId]||0)-Number(m.qty);
    }
    return o;
  },
  minimumVoorstel(verbruik90,levertijd){
    if(!(verbruik90>0))return 0;
    return Math.ceil(verbruik90/90*(Number(levertijd)||7)*1.5);
  },
  telKeuze(products,stock,nowIso,n){
    const iv={A:30,B:60,C:120},now=new Date(nowIso).getTime();
    return products.map(p=>{const l=stock[p.id]?.lastCount,d=l?(now-new Date(l).getTime())/864e5:9999;return {p,score:d/(iv[p.klasse||"B"]||60)}})
      .sort((a,b)=>b.score-a.score||a.p.naam.localeCompare(b.p.naam,"nl")).slice(0,n).map(x=>x.p);
  },
  fnv(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
};
</script>

<script>

      await Laag.haal(t).catch(()=>{});

  }
};

const docRef=(t,id)=>({id,
  set:d=>Laag.schrijfOp({op:"set",t,id,d}),

  collection:t=>({

/* ---------- Stock ---------- */

let liveStream=null;
function stopLive(){if(liveStream){liveStream.getTracks().forEach(t=>t.stop());liveStream=null}$("#live").hidden=true}
async function startLive(){
  if(!window.jsQR)return toast("De scanner kon niet laden. Gebruik een foto.");
  try{liveStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false})}catch{return toast("Geef de app toegang tot de camera, of gebruik een foto.")}
  const v=$("#cam");v.srcObject=liveStream;$("#live").hidden=false;await v.play();
  const c=document.createElement("canvas"),g=c.getContext("2d",{willReadFrequently:true});
  const tik=()=>{
    if(!liveStream)return;
    if(v.videoWidth){const r=Math.min(1,800/v.videoWidth);c.width=v.videoWidth*r;c.height=v.videoHeight*r;g.drawImage(v,0,0,c.width,c.height);
      const q=jsQR(g.getImageData(0,0,c.width,c.height).data,c.width,c.height);
      if(q&&/#[pb]-/.test(q.data)){stopLive();if(navigator.vibrate)navigator.vibrate(80);const f=code(q.data);if(f)toast(f);return}}
    setTimeout(()=>requestAnimationFrame(tik),150);
  };tik();
}
$("#liveStop").onclick=stopLive;
function code(text){
  const b=/#b-(t[a-z0-9]+)-([a-z0-9]+)/.exec(text);
  if(b){const t=state.ploegen.find(x=>x.id===b[1]),n=t?.leden?.find(x=>Stock.fnv(x)===b[2]);
    if(!n)return "Deze badge hoort bij iemand die niet meer in een ploeg staat.";
    onthoud({ploeg:t.id,persoon:n,badge:true});toast(`Je boekt nu als ${n}`);render();return ""}
  const m=/#p-([a-z0-9]+)/.exec(text);
  if(!m)return "Geen label herkend. Neem de foto van dichterbij, recht voor het label, en met goed licht.";
  if(!state.products.some(x=>x.id==="p"+m[1]))return "Dit label hoort bij een artikel dat niet meer bestaat.";
  productSheet("p"+m[1]);return "";
}
$("#photo").addEventListener("change",async e=>{

/* ---------- Waarde ---------- */
function perPloeg(maand){
  const o={};
  for(const m of state.movements){
    if(!["uit","retour"].includes(m.type)||cur.undone.has(m.id)||!m.at.startsWith(maand))continue;
    const k=m.ploeg||"Geen ploeg ingevuld",x=o[k]||(o[k]={c:0,n:0,mensen:{}}),c=cur.cost[m.id]||0;x.c+=c;x.n++;if(m.persoon)x.mensen[m.persoon]=(x.mensen[m.persoon]||0)+c;
  }
  return Object.entries(o).sort((a,b)=>b[1].c-a[1].c);
}
function perWerf(){
  const o={};
  for(const m of state.movements){if(!["uit","retour"].includes(m.type)||!m.werf||cur.undone.has(m.id))continue;const k=m.werf.trim(),x=o[k]||(o[k]={c:0,at:""});x.c+=cur.cost[m.id]||0;if(m.at>x.at)x.at=m.at}
  state.werven.forEach(w=>{o[w.naam]=o[w.naam]||{c:0,at:""}});
  return Object.entries(o).sort((a,b)=>a[1].at<b[1].at?1:-1).slice(0,15);
}

  if(!state.asOf)state.asOf=nowIso().slice(0,10);

  const per=CATS.map(c=>({c,v:prods.filter(p=>p.categorie===c).reduce((a,p)=>a+Stock.value(r.stock[p.id]),0)})),tot=per.reduce((a,x)=>a+x.v,0);
  const perPl=plaatsen().map(x=>({n:x.naam,v:prods.reduce((a,p)=>{const s=r.stock[p.id];return a+(s?Math.max(s.pl[x.id]||0,0)*s.avg:0)},0)})).filter(x=>x.v);
  const rows=prods.filter(p=>(r.stock[p.id]?.qty||0)!==0),w=perWerf(),pp=perPloeg(state.asOf.slice(0,7));
  const vr={};state.movements.forEach(m=>{if(m.type==="telling"&&m.reden&&!cur.undone.has(m.id)&&m.at.startsWith(state.asOf.slice(0,4))&&cur.diff[m.id])vr[m.reden]=(vr[m.reden]||0)+cur.diff[m.id]});
  const grens=new Date(Date.now()-180*864e5).toISOString();
  const stil=prods.filter(p=>{const s=op(p.id);return s.qty>0&&!(s.lastOut>grens)&&(s.lastIn||"")<grens}).sort((a,b)=>Stock.value(op(b.id))-Stock.value(op(a.id)));
  const wb=n=>state.werven.find(x=>x.naam===n);

async function savePdf(naam,items){
  if(!state.downloads||!window.jspdf||!window.qrcode)return toast("Bewaren als pdf lukt niet in deze weergave.");
  const d=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),W=70,H=37,C=3,R=8;
  items.forEach((it,i)=>{
    if(i&&i%(C*R)===0)d.addPage();
    const n=i%(C*R),x=(n%C)*W,y=.5+Math.floor(n/C)*H,q=qrcode(0,"M");q.addData(it.url);q.make();
    const c=q.getModuleCount(),m=29/c;d.setFillColor(0,0,0);
    for(let r=0;r<c;r++)for(let k=0;k<c;k++)if(q.isDark(r,k))d.rect(x+3+k*m,y+4+r*m,m+.02,m+.02,"F");
    d.setDrawColor(210);d.rect(x+.5,y+.5,W-1,H-1);
    d.setFont("helvetica","bold");d.setFontSize(10);d.text(d.splitTextToSize(it.titel,W-36).slice(0,4),x+34,y+9);
    d.setFont("helvetica","normal");d.setFontSize(8);d.text(it.sub,x+34,y+27);
  });
  try{await state.downloads.save({filename:naam,data:d.output("blob")})}catch(e){if(e.code!=="declined")toast("Bewaren is niet gelukt.")}
}

const KOLOM=["Naam","Categorie","Eenheid","Artikelnr","Minimum","Locatie","Leverancier","Klasse","Beginstock","Prijs"];
function parseCsv(t){
  const sep=(t.split("\n")[0].match(/;/g)||[]).length>=(t.split("\n")[0].match(/,/g)||[]).length?";":",",rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===sep){r.push(c);c=""}else if(ch==="\n"){r.push(c);rows.push(r);r=[];c=""}else if(ch!=="\r")c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}return rows.filter(x=>x.some(v=>String(v).trim()));
}
function naarArtikels(rows){
  const h=rows[0].map(x=>String(x).trim().toLowerCase()),i=n=>h.indexOf(n.toLowerCase());
  if(i("Naam")<0)throw new Error("kolom");
  return rows.slice(1).map(r=>{const g=n=>i(n)<0?"":String(r[i(n)]??"").trim();const k=g("Klasse").toUpperCase();
    return {naam:g("Naam"),categorie:CATS.find(c=>c.toLowerCase().startsWith(g("Categorie").toLowerCase().slice(0,5))&&g("Categorie"))||CATS[0],eenheid:g("Eenheid")||"stuk",artikelnr:g("Artikelnr"),minimum:dec(g("Minimum"))||0,locatie:g("Locatie"),leverancier:g("Leverancier"),klasse:["A","B","C"].includes(k)?k:"B",_q:dec(g("Beginstock"))||0,_p:dec(g("Prijs"))}}).filter(a=>a.naam);
}

  <div class="grid2"><label>Categorie<select id="f-cat">${CATS.map(c=>`<option ${c===p.categorie?"selected":""}>${c}</option>`).join("")}</select></label>
  <label>Eenheid<select id="f-unit">${UNITS.map(u=>`<option ${u===p.eenheid?"selected":""}>${u}</option>`).join("")}</select></label></div>
  <label>Klasse<select id="f-kl">${Object.entries(KLASSE).map(([k,v])=>`<option value="${k}" ${k===(p.klasse||"B")?"selected":""}>${v}</option>`).join("")}</select></label>
  <div class="grid2"><label>Artikelnr<input id="f-nr" value="${esc(p.artikelnr)}" autocomplete="off"></label><label>Minimum<input id="f-min" inputmode="decimal" value="${esc(p.minimum)}" autocomplete="off"></label></div>
  <div class="grid2"><label>Bijbestellen tot<input id="f-doel" inputmode="decimal" value="${esc(p.doelstock||"")}" autocomplete="off" placeholder="Leeg: tot minimum"></label><label>Levertijd (dagen)<input id="f-lev-d" inputmode="decimal" value="${esc(p.levertijd??7)}" autocomplete="off"></label></div>
  <div class="grid2"><label>Rek of locatie<input id="f-loc" value="${esc(p.locatie)}" placeholder="Bv. Rek B2" autocomplete="off"></label><label>Leverancier<input id="f-lev" value="${esc(p.leverancier)}" autocomplete="off"></label></div>
  ${state.assets?`<label>Foto<input id="f-foto" type="file" accept="image/*"></label>`:""}
  ${isNew?`<div class="grid2"><label>Beginstock<input id="f-qty" inputmode="decimal" autocomplete="off"></label><label>Aankoopprijs per eenheid (€, excl. btw)<input id="f-price" inputmode="decimal" autocomplete="off"></label></div>`:""}
  <div id="f-err" class="notice err" hidden></div><button class="btn primary">${isNew?"Artikel toevoegen":"Wijzigingen opslaan"}</button>
  ${isNew?"":`<button type="button" class="btn bad" id="arch">Artikel verbergen</button>`}</form>`);
  $("#close").onclick=closeSheet;const err=t=>{const e=$("#f-err");e.textContent=t;e.hidden=false};
  if($("#f-foto"))$("#f-foto").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{
    const b=await createImageBitmap(f),r=Math.min(1,900/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=b.width*r;c.height=b.height*r;c.getContext("2d").drawImage(b,0,0,c.width,c.height);
    const bl=await new Promise(o=>c.toBlob(o,"image/jpeg",.8));fotoId=(await state.assets.upload(bl)).id;toast("Foto klaar")}catch{err("De foto kon niet opgeladen worden.")}};
  if(!isNew)$("#arch").onclick=async()=>{if(op(p.id).qty!==0)return err("Dit artikel heeft nog stock. Doe eerst een telling op 0.");try{await state.db.doc("products/"+p.id).update({archived:true});toast("Artikel verborgen");closeSheet()}catch(e){err(writeError(e))}};
  $("#pf").onsubmit=async e=>{e.preventDefault();
    const naam=$("#f-naam").value.trim();if(!naam)return err("Geef het artikel een naam.");
    const n=(id)=>{const v=$(id).value.trim();return v===""?0:dec(v)},min=n("#f-min"),doel=n("#f-doel"),lev=n("#f-lev-d");
    if(!(min>=0)||!(doel>=0)||!(lev>=0))return err("Minimum, bijbestellen tot en levertijd moeten getallen zijn.");
    const body={naam,categorie:$("#f-cat").value,eenheid:$("#f-unit").value,klasse:$("#f-kl").value,artikelnr:$("#f-nr").value.trim(),minimum:min,doelstock:doel,levertijd:lev,locatie:$("#f-loc").value.trim(),leverancier:$("#f-lev").value.trim(),fotoId};
    try{
      if(isNew){
        const qv=$("#f-qty").value.trim(),q=qv===""?0:dec(qv),pr=dec($("#f-price").value);
        if(!(q>=0))return err("De beginstock moet een getal zijn.");
        if(q>0&&!(pr>=0))return err("Vul de aankoopprijs in, zodat de stockwaarde klopt.");
        const id=newId("p");await state.db.doc("products/"+id).set(body);
        if(q>0){const mid=newId("m");await state.db.doc("prijzen/"+mid).set({price:pr});await state.db.collection("movements").doc(mid).set({productId:id,type:"in",qty:q,note:"Beginstock",at:nowIso(),by:state.uid||""})}
        toast("Artikel toegevoegd");
      }else{await state.db.doc("products/"+p.id).update(body);toast("Wijzigingen opgeslagen")}
      closeSheet();
    }catch(x){err(writeError(x))}
  };
}
async function clearExamples(){
  const ids=new Set(state.products.filter(p=>p.voorbeeld).map(p=>p.id));
  try{
    for(const m of state.movements.filter(m=>ids.has(m.productId))){await state.db.doc("movements/"+m.id).delete();if(state.prijzen[m.id]!=null)await state.db.doc("prijzen/"+m.id).delete()}
    for(const id of ids)await state.db.doc("products/"+id).delete();
    state.cart=state.cart.filter(c=>!ids.has(c.id));toast("Voorbeelden gewist");
  }catch(e){toast(writeError(e))}
}
function route(){
  const h=location.hash;
  if(!state.loaded.p||!state.loaded.m)return;
  if(/^#[pb]-/.test(h)){const f=code(h);if(f)toast(f)}
}
$$("nav button").forEach(b=>b.onclick=()=>{state.view=b.dataset.v;closeSheet();render();scrollTo(0,0)});
window.addEventListener("hashchange",route);
render();
(async()=>{
  const timer=setTimeout(()=>{if(!state.loaded.p){state.problem="De gegevens zijn nog niet bereikbaar. Controleer je verbinding.";render()}},10000);
  const [db,user,downloads,assets]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads"),claude.use("assets")]);
  Object.assign(state,{db,user,downloads,assets});
  if(!db){clearTimeout(timer);state.problem="Meld je aan om de stock te zien.";render();return}
  try{state.uid=await user?.id()}catch{}
  try{state.isAdmin=await user?.canEdit()===true}catch{}
  let routed=false;
  const done=()=>{const open=!$("#sheet").hidden;render();if(open&&state.openId&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)))productSheet(state.openId);if(!routed&&state.loaded.p&&state.loaded.m){routed=true;clearTimeout(timer);route()}};
  const fail=()=>{state.problem="De verbinding met de gegevens is verbroken. Open de app opnieuw.";render()};
  const col=(n,f)=>db.collection(n).onSnapshot(s=>{f(s.docs.map(d=>({id:d.id,...d.data()})));done()},fail);
  if(state.isAdmin){col("prijzen",r=>{const o={};r.forEach(x=>o[x.id]=x.price);state.prijzen=o});col("werven",r=>state.werven=r)}
  col("ploegen",r=>state.ploegen=r);col("pakketten",r=>state.pakketten=r);
  col("products",r=>{state.products=r;state.loaded.p=true});
  col("movements",r=>{state.movements=r;state.loaded.m=true});
})();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body></html>
